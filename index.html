<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>datigrezzi</title>
<meta name="description" content="Strumenti open source per la scuola e anche per il resto. Sito in costruzione.">
<link rel="icon" href="marchio/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="marchio/icona-180.png">
<style>
/* Caratteri ospitati qui, non su server esterni: resa identica ovunque
   e nessuna richiesta verso terzi. Zilla Slab e IBM Plex Mono, SIL OFL 1.1. */
@font-face{font-family:'Zilla Slab';font-style:normal;font-weight:700;font-display:block;
  src:url('caratteri/ZillaSlab-Bold.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:700;font-display:block;
  src:url('caratteri/IBMPlexMono-Bold.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:block;
  src:url('caratteri/IBMPlexMono-Medium.woff2') format('woff2')}
</style>
<style>
:root{--avorio:#F4F0E6;--inchiostro:#16303B;--petrolio:#17605C;--rosso:#B93A28;
  --grafite:#5E6D72;--bordo:#E3DCCB}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;min-height:100%;background:var(--avorio);color:var(--inchiostro);
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  display:flex;align-items:center;justify-content:center;
  padding:2.5rem 1.25rem;text-align:center}
main{max-width:100%;width:min(46rem,100%)}

/* ---------------- marchio ---------------- */
.dg{display:inline-flex;align-items:center;line-height:1;max-width:100%;
  font-size:clamp(1.35rem,6.2vw,3.2rem)}
.dg__segno{display:block;flex:0 0 auto;margin-right:.035em}
.dg__testo{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.dg__nome{font-family:'Zilla Slab',"Roboto Slab","Noto Serif",Georgia,serif;
  font-weight:700;font-size:1em;line-height:.98;letter-spacing:-.015em;
  white-space:nowrap;color:var(--inchiostro)}
.dg__nome b{color:var(--rosso)}

/* il puntino della i: rettangolo di 129x134 millesimi di em, bordo superiore a
   665 millesimi sopra la linea di base. Numeri presi dal file del carattere.
   La quota si calcola a video, così vale su qualunque sistema. */
.dg__i{position:relative;display:inline-block}
.dg__base{display:inline-block;width:0;height:0;vertical-align:baseline}
.dg__punto{position:absolute;background:var(--petrolio);width:.129em;height:.134em;
  left:50.7%;transform:translateX(-50%);top:0;pointer-events:none}

.dg__sotto{display:flex;justify-content:space-between;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:700;
  font-size:.158em;line-height:1;text-transform:uppercase;
  color:var(--petrolio);margin-top:.6em}
.dg__sotto .sp{width:.55em;flex:0 0 auto}

.dg__segno .g{opacity:0;transform:translateY(var(--sposta,0));
  transition:opacity .5s ease-out, transform .9s cubic-bezier(.3,1.1,.4,1)}
.dg.vai .dg__segno .g{opacity:1;transform:translateY(0)}

/* ---------------- frase ---------------- */
.frase{font-family:'Zilla Slab',"Roboto Slab",Georgia,serif;font-weight:700;
  font-size:clamp(1.05rem,3.4vw,1.5rem);line-height:1.35;
  max-width:28rem;margin:2.6rem auto 0;color:var(--inchiostro)}
.frase em{font-style:normal;color:var(--petrolio)}

/* ---------------- loghi ---------------- */
.loghi{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:clamp(1.6rem,5vw,3rem) clamp(2rem,6vw,3.6rem);
  margin:3.4rem 0 0;padding:0;list-style:none}
.loghi li{display:flex}
.loghi img{display:block;height:clamp(30px,7.2vw,44px);width:auto;max-width:100%}

/* ---------------- avviso e contatto ---------------- */
.avviso{margin:3.4rem 0 0;font-size:clamp(.62rem,2.6vw,.78rem);font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--grafite)}
.avviso::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--rosso);margin-right:.7rem;vertical-align:middle;
  animation:respiro 2.4s ease-in-out infinite}
@keyframes respiro{0%,100%{opacity:1}50%{opacity:.25}}

.riga{margin:.9rem 0 0;font-size:clamp(.7rem,3vw,.82rem);color:var(--grafite);
  word-break:break-word}
.riga a{color:var(--petrolio)}
.riga a:focus-visible{outline:2px solid var(--rosso);outline-offset:3px}

@media(prefers-reduced-motion:reduce){
  .dg__segno .g{opacity:1;transform:none;transition:none}
  .avviso::before{animation:none}
}
</style>
</head>
<body>
<main>
  <div class="dg" id="marchio"></div>

  <p class="frase">Strumenti  <em>open source</em> per la scuola e anche per il resto&hellip;</p>

  <ul class="loghi">
    <li><img src="loghi/sostituto.svg" alt="SOStituto"></li>
    <li><img src="loghi/corez.svg" alt="COREZ 4.10"></li>
    <li><img src="loghi/geclass.svg" alt="GEclass"></li>
    <li><img src="loghi/resplesso.svg" alt="RESplesso"></li>
    <li><img src="loghi/fantassist.png" alt="Fantassist 2.0"></li>
  </ul>

  <p class="avviso">Sito in costruzione</p>
  <p class="riga"><a href="mailto:info@datigrezzi.it">info@datigrezzi.it</a></p>
</main>

<script>
const SEGNO=[
  [21,16,7.6,'c','#B93A28',-26],[21,69,6,'c','#B93A28',18],[21,104,7.1,'c','#B93A28',30],
  [47,25,6.4,'c','#B93A28',-18],[47,65,7.1,'c','#B93A28',12],[47,95,6.2,'c','#B93A28',20],
  [73,28,6.5,'r5','#17605C',-8],[73,62,6.5,'r5','#17605C',5],[73,89,6.5,'r5','#17605C',8],
  [99,34,6.5,'r2','#16303B',0],[99,60,6.5,'r2','#16303B',0],[99,86,6.5,'r2','#16303B',0]
];
const SOTTOTITOLO="acquisisci · elabora · decidi";
const PUNTO_SOPRA_BASE = 0.665;

(function(){
  const dg=document.getElementById('marchio');
  const NS='http://www.w3.org/2000/svg';

  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 120 120');
  svg.setAttribute('class','dg__segno');
  svg.setAttribute('aria-hidden','true');
  SEGNO.forEach(([x,y,r,forma,col,sposta],i)=>{
    let e;
    if(forma==='c'){
      e=document.createElementNS(NS,'circle');
      e.setAttribute('cx',x);e.setAttribute('cy',y);e.setAttribute('r',r);
    }else{
      e=document.createElementNS(NS,'rect');
      e.setAttribute('x',x-r);e.setAttribute('y',y-r);
      e.setAttribute('width',r*2);e.setAttribute('height',r*2);
      e.setAttribute('rx',forma==='r5'?5:2);
    }
    e.setAttribute('fill',col);e.setAttribute('class','g');
    e.style.setProperty('--sposta',sposta+'px');
    e.style.transitionDelay=(i*45)+'ms';
    svg.appendChild(e);
  });

  const testo=document.createElement('div');testo.className='dg__testo';
  const nome=document.createElement('div');nome.className='dg__nome';
  nome.innerHTML='dati<b>grezz<span class="dg__i">i'
    +'<i class="dg__base"></i><i class="dg__punto"></i></span></b>';
  const sotto=document.createElement('div');sotto.className='dg__sotto';
  for(const ch of SOTTOTITOLO){
    const s=document.createElement('span');
    if(ch===' ') s.className='sp'; else s.textContent=ch;
    sotto.appendChild(s);
  }
  testo.append(nome,sotto);
  dg.append(svg,testo);

  const spanI=nome.querySelector('.dg__i');
  const base =nome.querySelector('.dg__base');
  const punto=nome.querySelector('.dg__punto');

  function misura(){
    const h=testo.getBoundingClientRect().height;
    svg.style.width=h+'px'; svg.style.height=h+'px';
    sotto.style.width=nome.getBoundingClientRect().width+'px';
    const corpo=parseFloat(getComputedStyle(nome).fontSize);
    const yBase=base.getBoundingClientRect().top - spanI.getBoundingClientRect().top;
    punto.style.top=(yBase - PUNTO_SOPRA_BASE*corpo)+'px';
  }
  function avvia(){misura();requestAnimationFrame(()=>dg.classList.add('vai'));}

  avvia();
  if(document.fonts){
    document.fonts.ready.then(misura);
    Promise.all([
      document.fonts.load('700 1em "Zilla Slab"'),
      document.fonts.load('700 1em "IBM Plex Mono"')
    ]).then(misura).catch(()=>{});
  }
  setTimeout(misura,1200); setTimeout(misura,3000);
  window.addEventListener('resize',misura);
})();
</script>
</body>
</html>
