<!-- ============================================================
     MARCHIO datigrezzi — blocco completo
     Copia il <style> nel foglio di stile e il <div class="dg"> dove serve.
     Richiede Zilla Slab 700 e IBM Plex Mono 700 (link qui sotto).
     ============================================================ -->

<style>
@font-face{font-family:'Zilla Slab';font-style:normal;font-weight:700;font-display:block;
  src:url('../caratteri/ZillaSlab-Bold.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:700;font-display:block;
  src:url('../caratteri/IBMPlexMono-Bold.woff2') format('woff2')}
</style>

<style>
.dg{
  --dg-inchiostro:#16303B;
  --dg-petrolio:#17605C;
  --dg-rosso:#B93A28;
  --dg-chiaro:#F4F0E6;
  display:inline-flex;
  align-items:center;
  font-size:2.4rem;          /* unica misura da cambiare: tutto scala da qui */
  line-height:1;
}
.dg__segno{display:block;flex:0 0 auto;margin-right:.035em}
.dg__testo{display:flex;flex-direction:column;align-items:flex-start}
.dg__nome{
  font-family:'Zilla Slab',Georgia,serif;font-weight:700;
  font-size:1em;line-height:.98;letter-spacing:-.015em;white-space:nowrap;
  color:var(--dg-inchiostro);
}
.dg__nome b{font-weight:700;color:var(--dg-rosso)}
.dg__i{position:relative;display:inline-block}
.dg__i::after{
  content:"";position:absolute;left:50%;top:.055em;transform:translateX(-50%);
  width:.185em;height:.185em;border-radius:50%;background:var(--dg-petrolio);
}
.dg__sotto{
  display:flex;justify-content:space-between;
  font-family:'IBM Plex Mono',monospace;font-weight:700;
  font-size:.158em;line-height:1;letter-spacing:0;
  text-transform:uppercase;color:var(--dg-petrolio);
  margin-top:.6em;
}
.dg__sotto span{display:block}
.dg__sotto .sp{width:.55em;flex:0 0 auto}

/* versione per fondi scuri: aggiungi class="dg dg--negativo" */
.dg--negativo .dg__nome{color:var(--dg-chiaro)}
</style>

<div class="dg">
  <svg class="dg__segno" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="21" cy="16" r="7.6" fill="#B93A28"/>
    <circle cx="21" cy="69" r="6" fill="#B93A28"/>
    <circle cx="21" cy="104" r="7.1" fill="#B93A28"/>
    <circle cx="47" cy="25" r="6.4" fill="#B93A28"/>
    <circle cx="47" cy="65" r="7.1" fill="#B93A28"/>
    <circle cx="47" cy="95" r="6.2" fill="#B93A28"/>
    <rect x="66.5" y="24.5" width="13" height="13" rx="5" fill="#17605C"/>
    <rect x="66.5" y="55.5" width="13" height="13" rx="5" fill="#17605C"/>
    <rect x="66.5" y="82.5" width="13" height="13" rx="5" fill="#17605C"/>
    <rect x="92.5" y="27.5" width="13" height="13" rx="2" fill="#16303B"/>
    <rect x="92.5" y="53.5" width="13" height="13" rx="2" fill="#16303B"/>
    <rect x="92.5" y="79.5" width="13" height="13" rx="2" fill="#16303B"/>
  </svg>
  <div class="dg__testo">
    <div class="dg__nome">dati<b>grezz<span class="dg__i">i</span></b></div>
    <div class="dg__sotto" data-testo="acquisisci &middot; elabora &middot; decidi"></div>
  </div>
</div>

<script>
/* Giustifica il sottotitolo sull'esatta larghezza del nome e allinea
   l'altezza del segno a quella di nome + sottotitolo. */
(function(){
  function comporre(dg){
    const sotto = dg.querySelector('.dg__sotto');
    const nome  = dg.querySelector('.dg__nome');
    const segno = dg.querySelector('.dg__segno');
    const testo = dg.querySelector('.dg__testo');

    if(!sotto.childElementCount){
      for(const ch of sotto.dataset.testo){
        const s=document.createElement('span');
        if(ch===' ') s.className='sp'; else s.textContent=ch;
        sotto.appendChild(s);
      }
    }
    const h = testo.getBoundingClientRect().height;
    segno.style.width = h+'px';
    segno.style.height = h+'px';
    sotto.style.width = nome.getBoundingClientRect().width+'px';
  }
  function tutti(){document.querySelectorAll('.dg').forEach(comporre);}
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(tutti);
  else window.addEventListener('load', tutti);
  window.addEventListener('resize', tutti);
})();
</script>
